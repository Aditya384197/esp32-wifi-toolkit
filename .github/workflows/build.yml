name: Build ESP32 WiFi Toolkit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup ESP-IDF & Build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.3.2
        command: |
          idf.py set-target esp32
          idf.py build

          # 🔥 एक ही शेल में मर्ज करें (esptool.py अब उपलब्ध है)
          esptool.py --chip esp32 merge_bin \
            -o build/esp32_wifi_toolkit_merged.bin \
            --flash_mode dio \
            --flash_size 2MB \
            0x1000 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/esp32_wifi_toolkit.bin

          # (Optional) phy_init_data.bin को भी जोड़ें
          # 0xF000 build/phy_init_data.bin

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: esp32-wifi-toolkit-firmware
        path: |
          build/**/*.bin
          build/esp32_wifi_toolkit_merged.bin
        retention-days: 30
