name: Build ESP8266 MicroHack (Ultra Aggressive)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          $HOME/bin/arduino-cli config init
          $HOME/bin/arduino-cli core update-index
          $HOME/bin/arduino-cli core install esp8266:esp8266

      - name: Compile sketch (ESP8266)
        run: |
          $HOME/bin/arduino-cli compile --fqbn esp8266:esp8266:generic esp32-wifi-toolkit.ino
