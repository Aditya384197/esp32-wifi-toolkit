name: Build ESP32 WiFi Toolkit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup ESP-IDF & Build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.3.2
        command: |
          idf.py set-target esp32
          idf.py build

          # 🔥 App Binary का नाम चेक करें और Merge करें
          if [ -f build/esp32_wifi_toolkit.bin ]; then
            APP_BIN=build/esp32_wifi_toolkit.bin
          else
            # Fallback: कोई भी .bin जो bootloader/partition/phy न हो
            APP_BIN=$(find build -name "*.bin" ! -name "bootloader.bin" ! -name "partition-table.bin" ! -name "phy_init_data.bin" | head -1)
          fi

          if [ -n "$APP_BIN" ]; then
            echo "Merging with app binary: $APP_BIN"
            esptool.py --chip esp32 merge_bin \
              -o build/esp32_wifi_toolkit_merged.bin \
              --flash_mode dio \
              --flash_size 2MB \
              0x1000 build/bootloader/bootloader.bin \
              0x8000 build/partition_table/partition-table.bin \
              0x10000 "$APP_BIN"
          else
            echo "❌ App binary not found! Skipping merge."
          fi

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: esp32-wifi-toolkit-firmware
        path: |
          build/**/*.bin
          build/esp32_wifi_toolkit_merged.bin
        retention-days: 30
